version: "3.9"

services:
  api:
    build: .
    container_name: api-cemiterio
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/cemiterio
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - ./public/images:/app/public/images   # mantém imagens no host

  mongo:
    image: mongo:6
    container_name: mongo-cemiterio
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

